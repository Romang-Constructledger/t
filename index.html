<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-icopQlGuufvqnXdTi0BZ9XhtMJ21Wdf+Zx9ZlRv1CoQ='; style-src 'sha256-38/ByMWGTJh1RMt4KrLB/nr96e39Np+/LV3QklD2VRo='; base-uri 'none'; form-action 'none'">
<meta name="backend" content="https://script.google.com/macros/s/AKfycbwD39QKy10Lrw37jq6mPpyuEJVOgcPcz0P4t4PIud0kOWjOkFCMwwqEXI2_dsl4R1Fa/exec">
<title>Tag</title>
<style>
body { margin: 0; font: 20px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f4f1; color: #141414; }
main { max-width: 480px; margin: 18vh auto 0; padding: 0 20px; text-align: center; }
a { color: inherit; }
@media (prefers-color-scheme: dark) { body { background: #101010; color: #f2f2f2; } }
</style>
</head>
<body>
<main>
<p id="msg">Opening&hellip;</p>
<noscript><p>Turn on JavaScript, or <a href="https://script.google.com/macros/s/AKfycbwD39QKy10Lrw37jq6mPpyuEJVOgcPcz0P4t4PIud0kOWjOkFCMwwqEXI2_dsl4R1Fa/exec">open the tag list</a>.</p></noscript>
</main>
<script>
(function () {
  var backend = document.querySelector('meta[name="backend"]').getAttribute('content');
  var id = new URLSearchParams(window.location.search).get('i') || '';
  if (/^[A-Z][0-9]{2}$/.test(id) && /^https:\/\/[^\s"<>]+$/.test(backend)) {
    window.location.replace(backend + '?i=' + id);
  } else {
    document.getElementById('msg').textContent = 'Unknown tag.';
  }
})();
</script>
</body>
</html>
